<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  MS Sans Serif puts each line of a glyph on a whole pixel. An antialiased
  line gets a gray edge, thus the text becomes blurry. GTK takes the same
  values from the keys of `fontRendering`, and Qt takes them from this file
  alone.
-->
<fontconfig>
  <match target="font">
    <test name="family" compare="contains">
      <string>MS Sans Serif</string>
    </test>
    <edit name="antialias" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintfull</const>
    </edit>
  </match>
</fontconfig>
